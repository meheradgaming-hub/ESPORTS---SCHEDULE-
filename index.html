<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Flash Team - Tournament Schedule</title>
    <style>
        :root {
            --bg-color: #070b19;
            --card-bg: #111827;
            --accent-glow: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --card-border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.2rem;
            color: #fbbf24;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .match-card {
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.4), rgba(17, 24, 39, 0.8));
            border: 1px solid var(--card-border);
            border-left: 5px solid #f59e0b;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
            border-color: #4b5563;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .match-time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .match-details span {
            display: flex;
            justify-content: space-between;
        }

        .match-details span strong {
            color: var(--text-main);
        }

        .rule-text {
            background: rgba(236, 72, 153, 0.08);
            border: 1px dashed rgba(236, 72, 153, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #f472b6;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="squad-title">NEO FLASH TEAM</h1>
            <p>Live Squad Schedule & Match Updates</p>
        </header>

        <!-- Match Schedule Section -->
        <div class="card">
            <h2 class="section-title">🎮 Live Match Schedules</h2>
            <div id="schedule-container">
                <div class="loading">Loading schedules from Google Sheets...</div>
            </div>
        </div>
    </div>

    <script>
        // 👉 আপনার গুগল শিটের Publish করা CSV লিংকটি এখানে বসাবেন:
        const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/131X2ZImv5R1yTUfQwZiuxm1cBxSGhiZrMY85akibdso/export?format=csv&gid=0';

        async function fetchGoogleSheetData() {
            try {
                if(MATCHES_CSV_URL.includes('http')) {
                    const matchRes = await fetch(MATCHES_CSV_URL);
                    const matchText = await matchRes.text();
                    parseMatches(matchText);
                } else {
                    document.getElementById('schedule-container').innerHTML = '<p style="color:#ef4444; text-align:center;">Please update your Matches CSV link in the code!</p>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function parseCSV(str) {
            const arr = [];
            let row = [''];
            let col = 0;
            let quote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i], next = str[i + 1];
                if (quote) {
                    if (c === '"' && next === '"') { row[col] += '"'; i++; }
                    else if (c === '"') { quote = false; }
                    else { row[col] += c; }
                } else {
                    if (c === '"') { quote = true; }
                    else if (c === ',') { row[++col] = ''; }
                    else if (c === '\r' && next === '\n') { i++; arr.push(row); row = ['']; col = 0; }
                    else if (c === '\n' || c === '\r') { arr.push(row); row = ['']; col = 0; }
                    else { row[col] += c; }
                }
            }
            if (row.length > 1 || row[0] !== '') arr.push(row);
            return arr;
        }

        function parseMatches(csvText) {
            const rows = parseCSV(csvText);
            let html = '';
            
            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (r.length >= 1 && r[0]) {
                    let tournamentName = r[0] || '';       // Tournament Name
                    let matchTypeRound = r[1] || '';       // Match Type / Round
                    let topQualify = r[2] || '';           // Top Qualify
                    let date = r[3] || '';                 // Date
                    let maps = r[4] || '';                 // Maps
                    let matchTime = r[5] || '';            // Match Time
                    let startTime = r[6] || '';            // Start Time
                    let status = r[7] || '';               // Status
                    let investmentAmount = r[8] || '';     // Investment Amount (৳)
                    let notes = r[9] || '';                // Notes

                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-title">🔥 ${tournamentName} <span style="font-size:0.9rem; color:#9ca3af; font-weight:normal;">(${matchTypeRound})</span></span>
                                <span class="match-time-badge">📅 ${date}</span>
                            </div>
                            <div class="match-details">
                                ${maps ? `<span>Maps: <strong>${maps}</strong></span>` : ''}
                                ${matchTime ? `<span>Match Time: <strong>${matchTime}</strong></span>` : ''}
                                ${startTime ? `<span>Start Time: <strong>${startTime}</strong></span>` : ''}
                                ${topQualify ? `<span>Top Qualify: <strong>${topQualify}</strong></span>` : ''}
                                ${status ? `<span>Status: <strong>${status}</strong></span>` : ''}
                                ${investmentAmount ? `<span>Investment: <strong style="color:#34d399;">৳${investmentAmount}</strong></span>` : ''}
                            </div>
                            ${notes ? `
                                <div class="rule-text">
                                    📝 <strong>Notes:</strong> ${notes}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            }
            document.getElementById('schedule-container').innerHTML = html || '<p style="color:var(--text-muted)">No matches available.</p>';
        }

        fetchGoogleSheetData();
    </script>
</body>
</html>
