<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Flash Team - Tournament Schedule</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .match-time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .match-details span strong {
            color: var(--text-main);
        }

        .rule-text {
            background: rgba(245, 158, 11, 0.05);
            border: 1px dashed var(--accent-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .team-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            list-style: none;
        }

        .team-list li {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }

        .team-list li span {
            color: var(--accent-color);
            font-weight: bold;
            margin-right: 8px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Neo Flash Team Tournaments</h1>
            <p>Live Squad Schedule & Match Updates</p>
        </header>

        <!-- Match Schedule Section -->
        <div class="card">
            <h2 class="section-title">🎮 Live Match Schedules</h2>
            <div id="schedule-container">
                <div class="loading">Loading schedules from Google Sheets...</div>
            </div>
        </div>

        <!-- Team List Section -->
        <div class="card">
            <h2 class="section-title">👥 Participating Teams</h2>
            <ul class="team-list" id="team-list-container">
                <div class="loading">Loading teams...</div>
            </ul>
        </div>
    </div>

    <script>
        // 👉 আপনার গুগল শিটের Publish করা CSV লিংক দুটি এখানে বসাবেন:
        const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/131X2ZImv5RlYtUFqwZiuxm1cBxSGhiZrMY85akibdso/export?format=csv&gid=0';
        const TEAMS_CSV_URL = 'https://docs.google.com/spreadsheets/d/131X2ZImv5RlYtUFqwZiuxm1cBxSGhiZrMY85akibdso/export?format=csv&gid=01';

        async function fetchGoogleSheetData() {
            try {
                if(MATCHES_CSV_URL.includes('http')) {
                    const matchRes = await fetch(MATCHES_CSV_URL);
                    const matchText = await matchRes.text();
                    parseMatches(matchText);
                } else {
                    document.getElementById('schedule-container').innerHTML = '<p style="color:#ef4444; text-align:center;">Please update your Matches CSV link in the code!</p>';
                }

                if(TEAMS_CSV_URL.includes('http')) {
                    const teamRes = await fetch(TEAMS_CSV_URL);
                    const teamText = await teamRes.text();
                    parseTeams(teamText);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function parseCSV(str) {
            const arr = [];
            let row = [''];
            let col = 0;
            let quote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i], next = str[i + 1];
                if (quote) {
                    if (c === '"' && next === '"') { row[col] += '"'; i++; }
                    else if (c === '"') { quote = false; }
                    else { row[col] += c; }
                } else {
                    if (c === '"') { quote = true; }
                    else if (c === ',') { row[++col] = ''; }
                    else if (c === '\r' && next === '\n') { i++; arr.push(row); row = ['']; col = 0; }
                    else if (c === '\n' || c === '\r') { arr.push(row); row = ['']; col = 0; }
                    else { row[col] += c; }
                }
            }
            if (row.length > 1 || row[0] !== '') arr.push(row);
            return arr;
        }

        function parseMatches(csvText) {
            const rows = parseCSV(csvText);
            let html = '';
            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (r.length >= 5 && r[0]) {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-title">🔥 ${r[0]}</span>
                                <span class="match-time-badge">⏰ ${r[1]}</span>
                            </div>
                            <div class="match-details">
                                <span>Map/Type: <strong>${r[2]}</strong></span>
                                <span>Timing: <strong>${r[3]}</strong></span>
                            </div>
                            <div class="rule-text">
                                🏆 <strong>Status/Rules:</strong> ${r[4]}
                            </div>
                        </div>
                    `;
                }
            }
            document.getElementById('schedule-container').innerHTML = html || '<p style="color:var(--text-muted)">No matches available.</p>';
        }

        function parseTeams(csvText) {
            const rows = parseCSV(csvText);
            let html = '';
            let count = 1;
            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (r[0] && r[0].trim() !== '') {
                    let num = count < 10 ? '0' + count : count;
                    html += `<li><span>${num}</span> ${r[0].trim()}</li>`;
                    count++;
                }
            }
            document.getElementById('team-list-container').innerHTML = html || '<p style="color:var(--text-muted)">No teams available.</p>';
        }

        fetchGoogleSheetData();
    </script>
</body>
</html>
