<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Flash Team - Tournament Schedule</title>
    <style>
        :root {
            --bg-color: #070b19;
            --card-bg: #111827;
            --accent-glow: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --card-border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Live Section Title */
        .section-title {
            font-size: 1.2rem;
            color: #fbbf24;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* History Section Title */
        .history-title {
            color: #9ca3af;
            border-bottom-color: #374151;
        }

        /* Base Match Card */
        .match-card {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Live Card Style */
        .live-card {
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.4), rgba(17, 24, 39, 0.8));
            border-left: 5px solid #f59e0b;
        }
        .live-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
            border-color: #4b5563;
        }
        .live-card .match-title {
            color: #ffffff;
        }
        .live-card .match-time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* History Card Style */
        .history-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 0.6));
            border-left: 5px solid #6b7280;
            opacity: 0.75; /* একটু আবছা দেখাবে */
        }
        .history-card:hover {
            opacity: 1;
            border-color: #4b5563;
        }
        .history-card .match-title {
            color: #d1d5db; /* একটু গ্রে কালার */
        }
        .history-card .match-time-badge {
            background: rgba(107, 114, 128, 0.15);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.3);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .match-time-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .match-details span {
            display: flex;
            justify-content: space-between;
        }

        .match-details span strong {
            color: var(--text-main);
        }

        .rule-text {
            background: rgba(236, 72, 153, 0.08);
            border: 1px dashed rgba(236, 72, 153, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #f472b6;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="squad-title">NEO FLASH TEAM</h1>
            <p>Live Squad Schedule & Match Updates</p>
        </header>

        <!-- Live Matches Section -->
        <div class="card">
            <h2 class="section-title">🎮 Live & Upcoming Matches</h2>
            <div id="live-container">
                <div class="loading">Loading schedules...</div>
            </div>
        </div>

        <!-- History Matches Section -->
        <div class="card">
            <h2 class="section-title history-title">📜 Match History</h2>
            <div id="history-container">
                <div class="loading">Loading history...</div>
            </div>
        </div>
    </div>

    <script>
        // 👉 আপনার গুগল শিটের Publish করা CSV লিংকটি এখানে বসাবেন:
        const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/1ntxtcAxIKwYPBzBsaZJbqGHCTpLBHLZ0uQfolmBtuuo/export?format=csv&gid=0';

        async function fetchGoogleSheetData() {
            try {
                if(MATCHES_CSV_URL.includes('http')) {
                    const matchRes = await fetch(MATCHES_CSV_URL);
                    const matchText = await matchRes.text();
                    parseMatches(matchText);
                } else {
                    const errorMsg = '<p style="color:#ef4444; text-align:center;">Please update your Matches CSV link!</p>';
                    document.getElementById('live-container').innerHTML = errorMsg;
                    document.getElementById('history-container').innerHTML = errorMsg;
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function parseCSV(str) {
            const arr = [];
            let row = [''];
            let col = 0;
            let quote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i], next = str[i + 1];
                if (quote) {
                    if (c === '"' && next === '"') { row[col] += '"'; i++; }
                    else if (c === '"') { quote = false; }
                    else { row[col] += c; }
                } else {
                    if (c === '"') { quote = true; }
                    else if (c === ',') { row[++col] = ''; }
                    else if (c === '\r' && next === '\n') { i++; arr.push(row); row = ['']; col = 0; }
                    else if (c === '\n' || c === '\r') { arr.push(row); row = ['']; col = 0; }
                    else { row[col] += c; }
                }
            }
            if (row.length > 1 || row[0] !== '') arr.push(row);
            return arr;
        }

        function parseMatches(csvText) {
            const rows = parseCSV(csvText);
            let liveHtml = '';
            let historyHtml = '';
            
            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (r.length >= 1 && r[0]) {
                    let tournamentName = r[0] || '';       
                    let matchTypeRound = r[1] || '';       
                    let topQualify = r[2] || '';           
                    let date = r[3] || '';                 
                    let maps = r[4] || '';                 
                    let matchTime = r[5] || '';            
                    let startTime = r[6] || '';            
                    let status = r[7] || '';               
                    let investmentAmount = r[8] || '';     
                    let notes = r[9] || '';                

                    // লজিক: Status এ completed, finished, বা played লেখা থাকলে সেটা হিস্ট্রিতে যাবে
                    let statusLower = status.toLowerCase();
                    let isHistory = statusLower.includes('completed') || statusLower.includes('finished') || statusLower.includes('played');
                    
                    // হিস্ট্রি হলে 'history-card' ক্লাস পাবে, নাহলে 'live-card' ক্লাস পাবে
                    let cardClass = isHistory ? 'match-card history-card' : 'match-card live-card';

                    let cardContent = `
                        <div class="${cardClass}">
                            <div class="match-header">
                                <span class="match-title">🔥 ${tournamentName} <span style="font-size:0.9rem; color:#9ca3af; font-weight:normal;">(${matchTypeRound})</span></span>
                                <span class="match-time-badge">📅 ${date}</span>
                            </div>
                            <div class="match-details">
                                ${maps ? `<span>Maps: <strong>${maps}</strong></span>` : ''}
                                ${matchTime ? `<span>Match Time: <strong>${matchTime}</strong></span>` : ''}
                                ${startTime ? `<span>Start Time: <strong>${startTime}</strong></span>` : ''}
                                ${topQualify ? `<span>Top Qualify: <strong>${topQualify}</strong></span>` : ''}
                                ${status ? `<span>Status: <strong style="${isHistory ? 'color:#9ca3af;' : 'color:#fbbf24;'}">${status}</strong></span>` : ''}
                                ${investmentAmount ? `<span>Investment: <strong style="${isHistory ? 'color:#9ca3af;' : 'color:#34d399;'}">৳${investmentAmount}</strong></span>` : ''}
                            </div>
                            ${notes ? `
                                <div class="rule-text" style="${isHistory ? 'border-color:#4b5563; background:rgba(75,85,99,0.1); color:#9ca3af;' : ''}">
                                    📝 <strong>Notes:</strong> ${notes}
                                </div>
                            ` : ''}
                        </div>
                    `;

                    // কন্ডিশন অনুযায়ী ভাগ করে দেওয়া হচ্ছে
                    if (isHistory) {
                        historyHtml += cardContent;
                    } else {
                        liveHtml += cardContent;
                    }
                }
            }
            
            // ওয়েবসাইটে শো করা
            document.getElementById('live-container').innerHTML = liveHtml || '<p style="color:var(--text-muted); text-align:center;">No upcoming matches at the moment.</p>';
            document.getElementById('history-container').innerHTML = historyHtml || '<p style="color:var(--text-muted); text-align:center;">No match history available yet.</p>';
        }

        fetchGoogleSheetData();
    </script>
</body>
    </html>
