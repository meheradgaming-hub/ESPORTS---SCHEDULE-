<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Flash Team - Tournament Hub</title>
    <style>
        :root {
            --bg-color: #070b19;
            --card-bg: #111827;
            --accent-glow: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --card-border: #374151;
            --income-color: #34d399; 
            --expense-color: #ef4444; 
            --balance-color: #38bdf8; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            padding: 25px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.2rem;
            color: #fbbf24;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .finance-card {
            border: 1px solid #1e3a8a;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }
        
        .finance-title {
            color: var(--balance-color);
            border-bottom-color: #1e3a8a;
        }

        .balance-container {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--balance-color);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            margin-bottom: 15px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; }

        .transaction-history {
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .transaction-history::-webkit-scrollbar { width: 6px; }
        .transaction-history::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }

        .history-header {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 5px 0;
            z-index: 10;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }

        .transaction-item.income { border-left-color: var(--income-color); }
        .transaction-item.expense { border-left-color: var(--expense-color); }

        .trans-left { display: flex; align-items: center; gap: 15px; }
        .trans-icon { font-size: 1.5rem; }
        .trans-desc { font-size: 1rem; color: var(--text-main); font-weight: 600; }
        .trans-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
        .trans-amount { font-size: 1.1rem; font-weight: 700; }
        
        .amt-income { color: var(--income-color); }
        .amt-expense { color: var(--expense-color); }

        .history-title { color: #9ca3af; border-bottom-color: #374151; }
        .match-card {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .live-card {
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.4), rgba(17, 24, 39, 0.8));
            border-left: 5px solid #f59e0b;
        }
        .live-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
            border-color: #4b5563;
        }
        .history-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 0.6));
            border-left: 5px solid #6b7280;
            opacity: 0.75;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .match-title { font-size: 1.2rem; font-weight: 700; }
        .match-time-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .history-card .match-time-badge {
            background: rgba(107, 114, 128, 0.15);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.3);
        }
        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }
        .match-details span { display: flex; justify-content: space-between; }
        .rule-text {
            background: rgba(236, 72, 153, 0.08);
            border: 1px dashed rgba(236, 72, 153, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .loading { text-align: center; color: var(--text-muted); padding: 30px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="squad-title">NEO FLASH TEAM</h1>
            <p>Schedule & Auto Fund Management</p>
        </header>

        <div class="card finance-card">
            <h2 class="section-title finance-title">💳 Fund Management (Auto)</h2>
            <div class="balance-container">
                <div class="balance-label">Current Balance</div>
                <div class="balance-amount" id="total-balance">৳0</div>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">TOTAL INCOME</div>
                        <div class="stat-value" id="total-income" style="color: var(--income-color);">+৳0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">TOTAL EXPENSE</div>
                        <div class="stat-value" id="total-expense" style="color: var(--expense-color);">-৳0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">NET PROFIT/LOSS</div>
                        <div class="stat-value" id="net-change">৳0</div>
                    </div>
                </div>
            </div>
            <div class="transaction-history">
                <div class="history-header" id="history-count">AUTO TRANSACTION HISTORY (0)</div>
                <div id="finance-container">
                    <div class="loading">Loading automated finances...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">🎮 Live & Upcoming Matches</h2>
            <div id="live-container">
                <div class="loading">Loading schedules...</div>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title history-title">📜 Match History</h2>
            <div id="history-container">
                <div class="loading">Loading history...</div>
            </div>
        </div>
    </div>

    <script>
        // আপনার আসল গুগল শিটের লিংক এখানে বসানো আছে
        const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/1ntxtcAxIKwYPBzBsaZJbqGHCTpLBHLZ0uQfolmBtuuo/export?format=csv&gid=0';

        async function fetchGoogleSheetData() {
            try {
                const matchRes = await fetch(MATCHES_CSV_URL);
                if (!matchRes.ok) throw new Error('Network response was not ok');
                const matchText = await matchRes.text();
                parseMatchesAndFinances(matchText);
            } catch (error) {
                console.error('Error fetching data:', error);
                const errorMsg = '<p style="color:#ef4444; text-align:center;">Failed to load data. Make sure your Google Sheet is set to "Anyone with the link can view".</p>';
                document.getElementById('live-container').innerHTML = errorMsg;
                document.getElementById('history-container').innerHTML = errorMsg;
                document.getElementById('finance-container').innerHTML = errorMsg;
            }
        }

        function parseCSV(str) {
            const arr = [];
            let row = [''];
            let col = 0;
            let quote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i], next = str[i + 1];
                if (quote) {
                    if (c === '"' && next === '"') { row[col] += '"'; i++; }
                    else if (c === '"') { quote = false; }
                    else { row[col] += c; }
                } else {
                    if (c === '"') { quote = true; }
                    else if (c === ',') { row[++col] = ''; }
                    else if (c === '\r' && next === '\n') { i++; arr.push(row); row = ['']; col = 0; }
                    else if (c === '\n' || c === '\r') { arr.push(row); row = ['']; col = 0; }
                    else { row[col] += c; }
                }
            }
            if (row.length > 1 || row[0] !== '') arr.push(row);
            return arr;
        }

        function parseMatchesAndFinances(csvText) {
            const rows = parseCSV(csvText);
            
            let liveHtml = '';
            let historyHtml = '';
            
            let totalIncome = 0;
            let totalExpense = 0;
            let financeHtml = '';
            let transactionCount = 0;
            
            for (let i = rows.length - 1; i >= 1; i--) {
                let r = rows[i];
                if (r.length >= 1 && r[0]) {
                    let tournamentName = r[0] || '';       
                    let matchTypeRound = r[1] || '';       
                    let topQualify = r[2] || '';           
                    let date = r[3] || 'Upcoming';                 
                    let maps = r[4] || '';                 
                    let matchTime = r[5] || '';            
                    let startTime = r[6] || '';            
                    let status = r[7] || '';               
                    let investmentAmount = parseFloat(r[8]) || 0; 
                    let prizeAmount = parseFloat(r[9]) || 0;      
                    let notes = r[10] || '';                      

                    if (prizeAmount > 0) {
                        totalIncome += prizeAmount;
                        transactionCount++;
                        financeHtml += `
                            <div class="transaction-item income">
                                <div class="trans-left">
                                    <div class="trans-icon">🏆</div>
                                    <div>
                                        <div class="trans-desc">Prize: ${tournamentName}</div>
                                        <div class="trans-date">${date}</div>
                                    </div>
                                </div>
                                <div class="trans-amount amt-income">+৳${prizeAmount}</div>
                            </div>
                        `;
                    }

                    if (investmentAmount > 0) {
                        totalExpense += investmentAmount;
                        transactionCount++;
                        financeHtml += `
                            <div class="transaction-item expense">
                                <div class="trans-left">
                                    <div class="trans-icon">🎮</div>
                                    <div>
                                        <div class="trans-desc">Entry: ${tournamentName}</div>
                                        <div class="trans-date">${date}</div>
                                    </div>
                                </div>
                                <div class="trans-amount amt-expense">-৳${investmentAmount}</div>
                            </div>
                        `;
                    }

                    let statusLower = status.toLowerCase();
                    let isHistory = statusLower.includes('completed') || statusLower.includes('finished') || statusLower.includes('played');
                    let cardClass = isHistory ? 'match-card history-card' : 'match-card live-card';

                    let cardContent = `
                        <div class="${cardClass}">
                            <div class="match-header">
                                <span class="match-title">🔥 ${tournamentName} ${matchTypeRound ? `<span style="font-size:0.9rem; color:#9ca3af; font-weight:normal;">(${matchTypeRound})</span>` : ''}</span>
                                <span class="match-time-badge">📅 ${date}</span>
                            </div>
                            <div class="match-details">
                                ${maps ? `<span>Maps: <strong>${maps}</strong></span>` : ''}
                                ${matchTime ? `<span>Match Time: <strong>${matchTime}</strong></span>` : ''}
                                ${startTime ? `<span>Start Time: <strong>${startTime}</strong></span>` : ''}
                                ${topQualify ? `<span>Top Qualify: <strong>${topQualify}</strong></span>` : ''}
                                ${status ? `<span>Status: <strong style="${isHistory ? 'color:#9ca3af;' : 'color:#fbbf24;'}">${status}</strong></span>` : ''}
                                ${investmentAmount > 0 ? `<span>Investment: <strong style="color:var(--expense-color);">৳${investmentAmount}</strong></span>` : ''}
                                ${prizeAmount > 0 ? `<span>Prize Won: <strong style="color:var(--income-color);">৳${prizeAmount}</strong></span>` : ''}
                            </div>
                            ${notes ? `
                                <div class="rule-text" style="${isHistory ? 'border-color:#4b5563; background:rgba(75,85,99,0.1); color:#9ca3af;' : ''}">
                                    📝 <strong>Notes:</strong> ${notes}
                                </div>
                            ` : ''}
                        </div>
                    `;

                    if (isHistory) historyHtml += cardContent;
                    else liveHtml += cardContent;
                }
            }
            
            document.getElementById('live-container').innerHTML = liveHtml || '<p style="color:var(--text-muted); text-align:center;">No upcoming matches.</p>';
            document.getElementById('history-container').innerHTML = historyHtml || '<p style="color:var(--text-muted); text-align:center;">No match history.</p>';

            let currentBalance = totalIncome - totalExpense;
            let netChangeColor = currentBalance >= 0 ? 'var(--income-color)' : 'var(--expense-color)';
            let netChangeSign = currentBalance > 0 ? '+' : '';

            document.getElementById('total-balance').innerText = `৳${currentBalance}`;
            document.getElementById('total-income').innerText = `+৳${totalIncome}`;
            document.getElementById('total-expense').innerText = `-৳${totalExpense}`;
            
            let netChangeEl = document.getElementById('net-change');
            netChangeEl.innerText = `${netChangeSign}৳${currentBalance}`;
            netChangeEl.style.color = netChangeColor;

            document.getElementById('history-count').innerText = `AUTO TRANSACTION HISTORY (${transactionCount})`;
            document.getElementById('finance-container').innerHTML = financeHtml || '<p style="color:var(--text-muted); text-align:center;">No investments or prizes recorded yet.</p>';
        }

        fetchGoogleSheetData();
    </script>
</body>
                            </html>
