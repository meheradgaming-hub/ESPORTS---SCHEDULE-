<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Flash Team - Tournament Schedule</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        /* লোগো স্টাইল */
        .site-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .match-time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .match-details span strong {
            color: var(--text-main);
        }

        .rule-text {
            background: rgba(245, 158, 11, 0.05);
            border: 1px dashed var(--accent-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>

            <img src="https://drive.google.com/file/d/1aG-LFnsCwwkDfeObiMpinmhNVF0VEwp7/view?usp=drivesdk" alt="Squad Logo" class="site-logo" id="site-logo">
            
            <!-- স্কোয়াড নাম অপশন -->
            <h1 id="squad-title">NEO FLASH </h1>
            <p>Live Squad Schedule & Match Updates</p>
        </header>

        <!-- Match Schedule Section -->
        <div class="card">
            <h2 class="section-title">🎮 Live Match Schedules</h2>
            <div id="schedule-container">
                <div class="loading">Loading schedules from Google Sheets...</div>
            </div>
        </div>
    </div>

    <script>
        // 👉 আপনার গুগল শিটের Publish করা CSV লিংকটি এখানে বসাবেন:
        const MATCHES_CSV_URL = 'https://docs.google.com/spreadsheets/d/1ntxtcAxIKwYPBzBsaZJbqGHCTpLBHLZ0uQfolmBtuuo/export?format=csv&gid=0';

        async function fetchGoogleSheetData() {
            try {
                if(MATCHES_CSV_URL.includes('http')) {
                    const matchRes = await fetch(MATCHES_CSV_URL);
                    const matchText = await matchRes.text();
                    parseMatches(matchText);
                } else {
                    document.getElementById('schedule-container').innerHTML = '<p style="color:#ef4444; text-align:center;">Please update your Matches CSV link in the code!</p>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function parseCSV(str) {
            const arr = [];
            let row = [''];
            let col = 0;
            let quote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i], next = str[i + 1];
                if (quote) {
                    if (c === '"' && next === '"') { row[col] += '"'; i++; }
                    else if (c === '"') { quote = false; }
                    else { row[col] += c; }
                } else {
                    if (c === '"') { quote = true; }
                    else if (c === ',') { row[++col] = ''; }
                    else if (c === '\r' && next === '\n') { i++; arr.push(row); row = ['']; col = 0; }
                    else if (c === '\n' || c === '\r') { arr.push(row); row = ['']; col = 0; }
                    else { row[col] += c; }
                }
            }
            if (row.length > 1 || row[0] !== '') arr.push(row);
            return arr;
        }

        function parseMatches(csvText) {
            const rows = parseCSV(csvText);
            let html = '';
            
            for (let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if (r.length >= 1 && r[0]) {
                    // শিটের কলাম অনুযায়ী নতুন ফিল্ডগুলো সেট করা হলো:
                    let tournamentName = r[0] || '';       // Tournament Name
                    let matchTypeRound = r[1] || '';       // Match Type / Round
                    let topQualify = r[2] || '';           // Top Qualify
                    let date = r[3] || '';                 // Date
                    let maps = r[4] || '';                 // Maps
                    let matchTime = r[5] || '';            // Match Time
                    let startTime = r[6] || '';            // Start Time
                    let status = r[7] || '';               // Status
                    let investmentAmount = r[8] || '';     // Investment Amount (৳)
                    let notes = r[9] || '';                // Notes

                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <span class="match-title">🔥 ${tournamentName} (${matchTypeRound})</span>
                                <span class="match-time-badge">📅 ${date}</span>
                            </div>
                            <div class="match-details">
                                ${maps ? `<span>Maps: <strong>${maps}</strong></span>` : ''}
                                ${matchTime ? `<span>Match Time: <strong>${matchTime}</strong></span>` : ''}
                                ${startTime ? `<span>Start Time: <strong>${startTime}</strong></span>` : ''}
                                ${topQualify ? `<span>Top Qualify: <strong>${topQualify}</strong></span>` : ''}
                                ${status ? `<span>Status: <strong>${status}</strong></span>` : ''}
                                ${investmentAmount ? `<span>Investment: <strong>৳${investmentAmount}</strong></span>` : ''}
                            </div>
                            ${notes ? `
                                <div class="rule-text">
                                    📝 <strong>Notes:</strong> ${notes}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }
            }
            document.getElementById('schedule-container').innerHTML = html || '<p style="color:var(--text-muted)">No matches available.</p>';
        }

        fetchGoogleSheetData();
    </script>
</body>
    </html>
